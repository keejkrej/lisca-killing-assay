[package]
name = "lisca-killing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Killing analysis (death-reporter fluorescence and fluorescent engagement) for LiSCA workspaces."
readme = "../../README.md"
rust-version = "1.85"

[lib]
name = "lisca_killing"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
csv = "1.3"
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"

[dev-dependencies]
tempfile = "3"
