[package]
name = "lisca-killing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Killing analysis (fluorescence, engagement, and the killing classifier) for LiSCA workspaces."
readme = "../../README.md"
rust-version = "1.85"

[lib]
name = "lisca_killing"
path = "src/lib.rs"

[features]
onnx = ["dep:image", "dep:ndarray", "dep:ort"]

[lints]
workspace = true

[dependencies]
csv = "1.3"
font-kit = { version = "0.14.3", features = ["source-fontconfig-dlopen"] }
marray = { git = "https://github.com/keejkrej/marray-rs", rev = "af67ac2d833f55e069f286022d0a0de0b9547bfb", version = "1.0.0", default-features = false, features = ["np", "skimage"] }
mplot = { git = "https://github.com/keejkrej/mplot-rs", rev = "8a596cdcb0f45eb1d48252b5c36c5d68ebfc2842", version = "1.0.0" }
image = { version = "0.25", optional = true, default-features = false }
ndarray = { version = "0.17", optional = true, features = ["std"] }
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
  "std",
  "ndarray",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
] }
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"

[dev-dependencies]
tempfile = "3"
