[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "killing"
version = "0.1.0"
description = "Killing assay library. The killing script is the local label-free training tool."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.138.0",
    "lightning>=2.6.5",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "tifffile>=2025.5.10",
    "torch>=2.12.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.1",
    "typer>=0.15",
    "uvicorn>=0.49.0",
]

[project.scripts]
killing = "killing.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "python-multipart>=0.0.20",
    "ruff>=0.9",
    "scikit-learn>=1.6",
    "ty>=0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/killing"]

[tool.hatch.build.targets.wheel.force-include]
"src/killing/static" = "killing/static"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"src/killing/commands/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "error"

[tool.uv]
exclude-newer = "7 days"
